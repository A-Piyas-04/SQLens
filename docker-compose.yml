services:
  frontend:
    build: .
    container_name: sql-simulator-frontend
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Browser must call same-origin /api; Vite proxies to the backend service.
      - VITE_API_URL=
      - VITE_API_PROXY_TARGET=http://backend:3001
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: sql-simulator-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    env_file:
      - ./backend/.env
    volumes:
      # Keep runtime in sync with backend/.env (dotenv + compose env_file).
      - ./backend/.env:/app/.env:ro
    dns:
      - 8.8.8.8
      - 8.8.4.4
